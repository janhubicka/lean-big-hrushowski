name: Track C arbitrary carrier genericity
on:
  pull_request:
    paths:
      - "BigHrushovski/CFPresentedStrictGeneric.lean"
      - "TrackCPresentedGenericCheck.lean"
      - ".github/workflows/track-c-presented-generic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presented-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build genericity on arbitrary vertex carrier
        run: lake build BigHrushovski.CFPresentedStrictGeneric
      - name: Audit theorem axioms and placeholders
        run: |
          lake env lean TrackCPresentedGenericCheck.lean > track-c-presented-axioms.log
          python3 scripts/check_axioms.py track-c-presented-axioms.log TrackCPresentedGenericCheck.lean
          python3 scripts/check_no_placeholders.py
