name: Track C strict d-closed back-and-forth core
on:
  pull_request:
    paths:
      - "BigHrushovski/CFDClosedBackAndForthCore.lean"
      - "TrackCBackAndForthCheck.lean"
      - ".github/workflows/track-c-backforth.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  track-c-backforth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build strict back-and-forth core
        run: lake build BigHrushovski.CFDClosedBackAndForthCore
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCBackAndForthCheck.lean > track-c-backforth-axioms.log
          python3 scripts/check_axioms.py track-c-backforth-axioms.log TrackCBackAndForthCheck.lean
          python3 scripts/check_no_placeholders.py
