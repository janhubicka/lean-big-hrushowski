name: Track C literal singleton request
on:
  pull_request:
    paths:
      - "BigHrushovski/CFSingletonStageRequest.lean"
      - "TrackCSingletonRequestCheck.lean"
      - ".github/workflows/track-c-singleton-request.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  singleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build literal singleton request theorem
        run: lake build BigHrushovski.CFSingletonStageRequest
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCSingletonRequestCheck.lean > track-c-singleton-axioms.log
          python3 scripts/check_axioms.py track-c-singleton-axioms.log TrackCSingletonRequestCheck.lean
          python3 scripts/check_no_placeholders.py
