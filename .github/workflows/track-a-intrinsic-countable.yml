name: Track A intrinsic countable closure components

on:
  push:
    paths:
      - 'BigHrushovski/C0CountableIntrinsicComponents.lean'
      - 'CheckC0IntrinsicCountable.lean'
      - 'scripts/check_c0_complete_unary_component_descent.py'
      - '.github/workflows/track-a-intrinsic-countable.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0CountableIntrinsicComponents.lean'
      - 'CheckC0IntrinsicCountable.lean'
      - 'scripts/check_c0_complete_unary_component_descent.py'
      - '.github/workflows/track-a-intrinsic-countable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build intrinsic closure components
        run: lake build BigHrushovski.C0CountableIntrinsicComponents
      - name: Audit exact theorem assumptions
        run: |
          set -euo pipefail
          lake env lean CheckC0IntrinsicCountable.lean > c0-intrinsic-countable-axioms.log
          python3 scripts/check_axioms.py c0-intrinsic-countable-axioms.log CheckC0IntrinsicCountable.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite complete-unary component descent regression
        run: python3 scripts/check_c0_complete_unary_component_descent.py
