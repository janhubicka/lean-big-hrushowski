name: Track A complete C0 functional Fraisse genericity

on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalFairGeneric.lean'
      - 'CheckC0FullFunctionalGeneric.lean'
      - '.github/workflows/track-a-c0-full-generic.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalFairGeneric.lean'
      - 'CheckC0FullFunctionalGeneric.lean'
      - '.github/workflows/track-a-c0-full-generic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build full functional fair genericity theorem
        run: lake build BigHrushovski.C0FunctionalFairGeneric
      - name: Exact theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FullFunctionalGeneric.lean > c0-full-generic-axioms.log
          python3 scripts/check_axioms.py c0-full-generic-axioms.log CheckC0FullFunctionalGeneric.lean
          python3 scripts/check_no_placeholders.py
