name: Track E CF finite-coordinate topology audit

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFBirthTopology.lean'
      - 'CheckTrackECFBirthTopology.lean'
      - '.github/workflows/track-e-cf-finite-coordinate-topology.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFBirthTopology.lean'
      - 'CheckTrackECFBirthTopology.lean'
      - '.github/workflows/track-e-cf-finite-coordinate-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-coordinates-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-coordinates-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile actual finite-coordinate support calculus
        run: |
          lake build BigHrushovski.HrushovskiEllentuckCFBirthTopology
          lake env lean CheckTrackECFBirthTopology.lean > cf-coordinate-axioms.log
          cat cf-coordinate-axioms.log
          python3 scripts/check_axioms.py cf-coordinate-axioms.log CheckTrackECFBirthTopology.lean
          python3 scripts/check_no_placeholders.py
