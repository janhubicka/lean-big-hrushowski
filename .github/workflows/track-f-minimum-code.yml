name: Track F minimum complete-code fibre
on:
  push:
    paths:
      - 'BigHrushovski/N0MinimumCodeClass.lean'
      - 'CheckTrackFMinimumCodeAxioms.lean'
      - 'scripts/check_track_f_minimum_code_fibre.py'
      - '.github/workflows/track-f-minimum-code.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0MinimumCodeClass.lean'
      - 'CheckTrackFMinimumCodeAxioms.lean'
      - 'scripts/check_track_f_minimum_code_fibre.py'
      - '.github/workflows/track-f-minimum-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build minimum-code fibre theorem
        run: lake build BigHrushovski.N0MinimumCodeClass
      - name: Kernel axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFMinimumCodeAxioms.lean > track-f-min-code-axioms.log
          python3 scripts/check_axioms.py track-f-min-code-axioms.log CheckTrackFMinimumCodeAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial minimum-code checks
        run: python3 scripts/check_track_f_minimum_code_fibre.py
