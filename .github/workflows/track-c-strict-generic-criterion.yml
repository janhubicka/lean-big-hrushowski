name: Track C exact strict genericity criterion
on:
  pull_request:
    paths:
      - "BigHrushovski/CFStrictGenericCharacterization.lean"
      - "TrackCStrictGenericCheck.lean"
      - ".github/workflows/track-c-strict-generic-criterion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact countable strict genericity criterion
        run: lake build BigHrushovski.CFStrictGenericCharacterization
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCStrictGenericCheck.lean > track-c-strict-generic-axioms.log
          python3 scripts/check_axioms.py track-c-strict-generic-axioms.log TrackCStrictGenericCheck.lean
          python3 scripts/check_no_placeholders.py
