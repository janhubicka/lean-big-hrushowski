name: Track E closed complete-support domain codes

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckClosedSupportCodes.lean'
      - 'CheckTrackEClosedSupportCodes.lean'
      - 'scripts/check_ellentuck_closed_codes.py'
      - '.github/workflows/track-e-closed-support-codes.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckClosedSupportCodes.lean'
      - 'CheckTrackEClosedSupportCodes.lean'
      - 'scripts/check_ellentuck_closed_codes.py'
      - '.github/workflows/track-e-closed-support-codes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-closed-codes-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-closed-codes-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build closed support code theorem
        run: lake build BigHrushovski.HrushovskiEllentuckClosedSupportCodes
      - name: Exhaust small support-code systems
        run: python3 scripts/check_ellentuck_closed_codes.py
      - name: Exact axiom and source checks
        run: |
          lake env lean CheckTrackEClosedSupportCodes.lean > track-e-closed-codes-axioms.log
          cat track-e-closed-codes-axioms.log
          python3 scripts/check_axioms.py track-e-closed-codes-axioms.log CheckTrackEClosedSupportCodes.lean
          python3 scripts/check_no_placeholders.py
