name: Track A closure-respecting chronological invariance

on:
  push:
    paths:
      - 'BigHrushovski/C0LowerRespectingOrderInvariance.lean'
      - 'CheckC0LowerRespectingOrderInvariance.lean'
      - 'scripts/check_c0_lower_respecting_order.py'
      - '.github/workflows/track-a-lower-respecting-order.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0LowerRespectingOrderInvariance.lean'
      - 'CheckC0LowerRespectingOrderInvariance.lean'
      - 'scripts/check_c0_lower_respecting_order.py'
      - '.github/workflows/track-a-lower-respecting-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build canonical lower-respecting order lemma
        run: lake build BigHrushovski.C0LowerRespectingOrderInvariance
      - name: Audit exact axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0LowerRespectingOrderInvariance.lean > c0-lower-order-axioms.log
          python3 scripts/check_axioms.py c0-lower-order-axioms.log CheckC0LowerRespectingOrderInvariance.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial full-value order regression
        run: python3 scripts/check_c0_lower_respecting_order.py
