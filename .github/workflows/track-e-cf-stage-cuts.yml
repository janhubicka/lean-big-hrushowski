name: Track E literal CF supported-domain cuts

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckStageCuts.lean'
      - 'CheckTrackECFStageCuts.lean'
      - '.github/workflows/track-e-cf-stage-cuts.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckStageCuts.lean'
      - 'CheckTrackECFStageCuts.lean'
      - '.github/workflows/track-e-cf-stage-cuts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-cuts-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-cuts-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile and audit actual CF literal stage cuts
        run: |
          lake build BigHrushovski.HrushovskiEllentuckStageCuts
          lake env lean CheckTrackECFStageCuts.lean > track-e-stage-cuts-axioms.log
          cat track-e-stage-cuts-axioms.log
          python3 scripts/check_axioms.py track-e-stage-cuts-axioms.log CheckTrackECFStageCuts.lean
          python3 scripts/check_no_placeholders.py
