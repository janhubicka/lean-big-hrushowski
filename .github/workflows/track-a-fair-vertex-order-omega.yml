name: Track A fair vertex order omega interface
on:
  push:
    paths:
      - 'BigHrushovski/C0FairVertexOrderOmega.lean'
      - 'CheckC0FairVertexOrderOmega.lean'
      - 'scripts/check_c0_fair_vertex_order_omega.py'
      - '.github/workflows/track-a-fair-vertex-order-omega.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FairVertexOrderOmega.lean'
      - 'CheckC0FairVertexOrderOmega.lean'
      - 'scripts/check_c0_fair_vertex_order_omega.py'
      - '.github/workflows/track-a-fair-vertex-order-omega.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build fair vertex-order omega interface
        run: lake build BigHrushovski.C0FairVertexOrderOmega
      - name: Audit exact axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FairVertexOrderOmega.lean > c0-vertex-order-omega-axioms.log
          python3 scripts/check_axioms.py c0-vertex-order-omega-axioms.log CheckC0FairVertexOrderOmega.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite orders and negative controls
        run: python3 scripts/check_c0_fair_vertex_order_omega.py
