name: Track A closed functional joint-step recursion
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalJointStepRecursion.lean'
      - 'CheckC0FunctionalJointStepRecursion.lean'
      - 'scripts/check_c0_functional_joint_step_recursion.py'
      - '.github/workflows/track-a-functional-joint-step-recursion.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalJointStepRecursion.lean'
      - 'CheckC0FunctionalJointStepRecursion.lean'
      - 'scripts/check_c0_functional_joint_step_recursion.py'
      - '.github/workflows/track-a-functional-joint-step-recursion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build closed functional joint-step recurrence
        run: lake build BigHrushovski.C0FunctionalJointStepRecursion
      - name: Audit seven exact theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalJointStepRecursion.lean > c0-joint-step-axioms.log
          python3 scripts/check_axioms.py c0-joint-step-axioms.log CheckC0FunctionalJointStepRecursion.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite coherent chain and initial-map regression
        run: python3 scripts/check_c0_functional_joint_step_recursion.py
      - name: Independently check underlying whole-function limit theorem
        run: python3 scripts/check_c0_functional_back_and_forth_limit.py
