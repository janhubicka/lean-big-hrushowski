name: Track C printed C_F generic identification
on:
  pull_request:
    paths:
      - "BigHrushovski/CFPublishedFraisseRecognition.lean"
      - "TrackCPublishedFraisseCheck.lean"
      - ".github/workflows/track-c-published-fraisse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  printed-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build complete printed generic identification
        run: lake build BigHrushovski.CFPublishedFraisseRecognition
      - name: Audit theorem axioms and placeholders
        run: |
          lake env lean TrackCPublishedFraisseCheck.lean > track-c-published-fraisse-axioms.log
          python3 scripts/check_axioms.py track-c-published-fraisse-axioms.log TrackCPublishedFraisseCheck.lean
          python3 scripts/check_no_placeholders.py
