name: Track F reachable SCC histories preserve canonicality
on:
  push:
    paths:
      - 'BigHrushovski/N0ReachableHistoryCanonical.lean'
      - 'CheckAxiomsN0ReachableHistoryCanonical.lean'
      - 'scripts/check_track_f_reachable_canonical.py'
      - '.github/workflows/track-f-reachable-history-canonical.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0ReachableHistoryCanonical.lean'
      - 'CheckAxiomsN0ReachableHistoryCanonical.lean'
      - 'scripts/check_track_f_reachable_canonical.py'
      - '.github/workflows/track-f-reachable-history-canonical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-reachable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic
      - name: Build reachable canonical SCC induction
        run: lake build BigHrushovski.N0ReachableHistoryCanonical
      - name: Named kernel axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckAxiomsN0ReachableHistoryCanonical.lean > canonical-reachable-axioms.log
          python3 scripts/check_axioms.py canonical-reachable-axioms.log CheckAxiomsN0ReachableHistoryCanonical.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite canonical-prefix tests
        run: |
          python3 scripts/check_track_f_reachable_canonical.py
          python3 scripts/check_track_f_tagged_histories.py
