name: Track A intrinsic fair birth component indices

on:
  push:
    paths:
      - 'BigHrushovski/C0FairComponentBirthIndex.lean'
      - 'CheckC0FairComponentBirthIndex.lean'
      - 'scripts/check_c0_fair_birth_index.py'
      - '.github/workflows/track-a-fair-component-birth-index.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FairComponentBirthIndex.lean'
      - 'CheckC0FairComponentBirthIndex.lean'
      - 'scripts/check_c0_fair_birth_index.py'
      - '.github/workflows/track-a-fair-component-birth-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite fair birth indices and dependency precedence
        run: lake build BigHrushovski.C0FairComponentBirthIndex
      - name: Audit exact axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FairComponentBirthIndex.lean > c0-fair-birth-index-axioms.log
          python3 scripts/check_axioms.py c0-fair-birth-index-axioms.log CheckC0FairComponentBirthIndex.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive birth-index regression
        run: python3 scripts/check_c0_fair_birth_index.py
