name: Lean Track D C0 Ordered Age Bridge

on:
  pull_request:
    paths:
      - "BigHrushovski/C0CoordinateOrderedAgeBridge.lean"
      - "BigHrushovski/C0CoordinateIntrinsicLocalOrder.lean"
      - "BigHrushovski/C0CoordinateLocalOrderChoice.lean"
      - "BigHrushovski/C0CoordinateCanonicalLocalRepresentative.lean"
      - "BigHrushovski/C0CoordinateCoherentLocalOrders.lean"
      - "BigHrushovski/C0CoordinateCodeRelabelling.lean"
      - "BigHrushovski/C0CoordinateNestedLocalOrders.lean"
      - "BigHrushovski/C0CoordinateIntrinsicLowerChoice.lean"
      - "BigHrushovski/C0CoordinateLocalOccurrenceFamily.lean"
      - "BigHrushovski/C0CoordinateTopPermutationOrbit.lean"
      - "BigHrushovski/C0CoordinateTopOrbitNormalizer.lean"
      - "BigHrushovski/C0CoordinateLocalTypeMatrixBridge.lean"
      - "BigHrushovski/C0CoordinatePointedTopRoots.lean"
      - "BigHrushovski/C0CoordinateTopChoiceRestrictions.lean"
      - "BigHrushovski/C0CoordinateHereditaryCatalogueReduction.lean"
      - "BigHrushovski/C0CoordinateFixedMatrixOrder.lean"
      - "BigHrushovski/C0CoordinateWellSupportedCode.lean"
      - "BigHrushovski/C0CoordinateBoundedSupportedFinite.lean"
      - "BigHrushovski/C0CoordinateRawC0Witness.lean"
      - "BigHrushovski/C0CoordinateNestedPresentedCodes.lean"
      - "BigHrushovski/C0CoordinateIntrinsicChildSupport.lean"
      - "BigHrushovski/C0CoordinateRawHostFiniteValue.lean"
      - "BigHrushovski/C0CoordinateRawHostUnaryClosure.lean"
      - "BigHrushovski/C0CoordinateRawHostGraph.lean"
      - "BigHrushovski/C0CoordinateRawHostFiniteClosure.lean"
      - "BigHrushovski/C0CoordinateRawHostFiniteOccurrence.lean"
      - "TrackDOrderedAgeCheckAxioms.lean"
      - ".github/workflows/track-d-ordered-age.yml"
      - "scripts/check_c0_chronological_order.py"
      - "scripts/check_c0_intrinsic_local_order.py"
      - "scripts/check_c0_local_order_transport.py"
      - "scripts/check_c0_coordinate_relabel.py"
      - "scripts/check_c0_nested_local_orders.py"
      - "scripts/check_c0_local_order_normalizer.py"
      - "scripts/check_c0_top_lower_preservation.py"
      - "scripts/check_c0_top_generated_restrictions.py"
      - "scripts/check_c0_code_support_bounds.py"
      - "scripts/check_c0_raw_canonical_codes.py"
      - "scripts/check_c0_nested_presented_codes.py"
      - "scripts/check_c0_raw_host_unary_axioms.py"
      - "scripts/check_c0_raw_host_graph.py"
      - "scripts/check_c0_raw_host_finite_closure.py"
      - "docs/TRACK_D_UNIFORM_LOCAL_ORDER_SELECTION_20261108.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-track-d-c0-ordered-age
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Check finite C0 regressions
        run: |
          python3 scripts/check_c0_coordinate_host_finite.py
          python3 scripts/check_c0_pointed_subcode.py
          python3 scripts/check_c0_induced_code.py
          python3 scripts/check_c0_chronological_order.py
          python3 scripts/check_c0_intrinsic_local_order.py
          python3 scripts/check_c0_local_order_transport.py
          python3 scripts/check_c0_coordinate_relabel.py
          python3 scripts/check_c0_nested_local_orders.py
          python3 scripts/check_c0_local_order_normalizer.py
          python3 scripts/check_c0_top_lower_preservation.py
          python3 scripts/check_c0_top_generated_restrictions.py
          python3 scripts/check_c0_code_support_bounds.py
          python3 scripts/check_c0_raw_canonical_codes.py
          python3 scripts/check_c0_nested_presented_codes.py
          python3 scripts/check_c0_raw_host_unary_axioms.py
          python3 scripts/check_c0_raw_host_graph.py
          python3 scripts/check_c0_raw_host_finite_closure.py
      - name: Build and audit exact Track D bridge
        run: |
          set -euo pipefail
          lake build BigHrushovski.C0CoordinateOrderedAgeBridge BigHrushovski.C0CoordinateIntrinsicLocalOrder BigHrushovski.C0CoordinateLocalOrderChoice BigHrushovski.C0CoordinateCanonicalLocalRepresentative BigHrushovski.C0CoordinateCoherentLocalOrders BigHrushovski.C0CoordinateCodeRelabelling BigHrushovski.C0CoordinateNestedLocalOrders BigHrushovski.C0CoordinateIntrinsicLowerChoice BigHrushovski.C0CoordinateLocalOccurrenceFamily BigHrushovski.C0CoordinateTopPermutationOrbit BigHrushovski.C0CoordinateTopOrbitNormalizer BigHrushovski.C0CoordinateLocalTypeMatrixBridge BigHrushovski.C0CoordinatePointedTopRoots BigHrushovski.C0CoordinateTopChoiceRestrictions BigHrushovski.C0CoordinateHereditaryCatalogueReduction BigHrushovski.C0CoordinateFixedMatrixOrder BigHrushovski.C0CoordinateWellSupportedCode BigHrushovski.C0CoordinateBoundedSupportedFinite BigHrushovski.C0CoordinateRawC0Witness BigHrushovski.C0CoordinateNestedPresentedCodes BigHrushovski.C0CoordinateIntrinsicChildSupport BigHrushovski.C0CoordinateRawHostFiniteValue BigHrushovski.C0CoordinateRawHostUnaryClosure BigHrushovski.C0CoordinateRawHostGraph BigHrushovski.C0CoordinateRawHostFiniteClosure BigHrushovski.C0CoordinateRawHostFiniteOccurrence
          lake env lean TrackDOrderedAgeCheckAxioms.lean > track-d-ordered-age-axioms.log
          python3 scripts/check_axioms.py track-d-ordered-age-axioms.log TrackDOrderedAgeCheckAxioms.lean
          python3 scripts/check_no_placeholders.py
