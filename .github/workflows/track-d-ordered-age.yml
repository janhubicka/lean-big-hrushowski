name: Lean Track D C0 Ordered Age Bridge

on:
  pull_request:
    paths:
      - "BigHrushovski/C0CoordinateOrderedAgeBridge.lean"
      - "TrackDOrderedAgeCheckAxioms.lean"
      - ".github/workflows/track-d-ordered-age.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-track-d-c0-ordered-age
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Check finite C0 regressions
        run: |
          python3 scripts/check_c0_coordinate_host_finite.py
          python3 scripts/check_c0_pointed_subcode.py
          python3 scripts/check_c0_induced_code.py
      - name: Build and audit exact Track D bridge
        run: |
          set -euo pipefail
          lake build BigHrushovski.C0CoordinateOrderedAgeBridge
          lake env lean TrackDOrderedAgeCheckAxioms.lean > track-d-ordered-age-axioms.log
          python3 scripts/check_axioms.py track-d-ordered-age-axioms.log TrackDOrderedAgeCheckAxioms.lean
          python3 scripts/check_no_placeholders.py
