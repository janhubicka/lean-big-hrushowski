name: Track E concrete CF range criterion

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFRangeFromFiniteUniqueness.lean'
      - 'CheckTrackECFRangeFromFiniteUniqueness.lean'
      - '.github/workflows/track-e-cf-range-criterion.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFRangeFromFiniteUniqueness.lean'
      - 'CheckTrackECFRangeFromFiniteUniqueness.lean'
      - '.github/workflows/track-e-cf-range-criterion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-cf-range-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-cf-range-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact actual CF range reduction
        run: lake build BigHrushovski.HrushovskiEllentuckCFRangeFromFiniteUniqueness
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean CheckTrackECFRangeFromFiniteUniqueness.lean > track-e-cf-range-axioms.log
          cat track-e-cf-range-axioms.log
          python3 scripts/check_axioms.py track-e-cf-range-axioms.log CheckTrackECFRangeFromFiniteUniqueness.lean
          python3 scripts/check_no_placeholders.py
