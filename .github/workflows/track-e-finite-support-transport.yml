name: Track E finite closed-source support transport

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteSupportTransport.lean'
      - 'CheckTrackEFiniteSupportTransport.lean'
      - '.github/workflows/track-e-finite-support-transport.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteSupportTransport.lean'
      - 'CheckTrackEFiniteSupportTransport.lean'
      - '.github/workflows/track-e-finite-support-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-finite-transport-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-finite-transport-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile finite partial support transport
        run: lake build BigHrushovski.HrushovskiEllentuckFiniteSupportTransport
      - name: Exact axiom and placeholder checks
        run: |
          lake env lean CheckTrackEFiniteSupportTransport.lean > track-e-finite-transport-axioms.log
          cat track-e-finite-transport-axioms.log
          python3 scripts/check_axioms.py track-e-finite-transport-axioms.log CheckTrackEFiniteSupportTransport.lean
          python3 scripts/check_no_placeholders.py
