name: Track A closed C0 empty-or-minimal canonical heredity
on:
  push:
    paths:
      - 'BigHrushovski/C0FiniteCanonicalHeredity.lean'
      - 'BigHrushovski/C0FiniteCanonicalRestriction.lean'
      - 'BigHrushovski/C0ClosedEmptyStepHeredity.lean'
      - 'CheckC0ClosedEmptyStepHeredity.lean'
      - 'scripts/check_c0_closed_empty_step_heredity.py'
      - '.github/workflows/track-a-closed-empty-step-heredity.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FiniteCanonicalHeredity.lean'
      - 'BigHrushovski/C0FiniteCanonicalRestriction.lean'
      - 'BigHrushovski/C0ClosedEmptyStepHeredity.lean'
      - 'CheckC0ClosedEmptyStepHeredity.lean'
      - 'scripts/check_c0_closed_empty_step_heredity.py'
      - '.github/workflows/track-a-closed-empty-step-heredity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build closed finite empty-component heredity and refactored dependencies
        run: lake build BigHrushovski.C0ClosedEmptyStepHeredity
      - name: Exact six theorem axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckC0ClosedEmptyStepHeredity.lean > c0-closed-empty-axioms.log
          python3 scripts/check_axioms.py c0-closed-empty-axioms.log CheckC0ClosedEmptyStepHeredity.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite canonical empty-slot hereditary regression
        run: python3 scripts/check_c0_closed_empty_step_heredity.py
