name: Track E actual countable R-H lift

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckActualCountableRH.lean'
      - 'CheckTrackEActualCountableRH.lean'
      - '.github/workflows/track-e-actual-countable-rh.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckActualCountableRH.lean'
      - 'CheckTrackEActualCountableRH.lean'
      - '.github/workflows/track-e-actual-countable-rh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-countable-rh-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-countable-rh-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile genuine countable R/H lift theorem
        run: lake build BigHrushovski.HrushovskiEllentuckActualCountableRH
      - name: Audit exact axioms and placeholders
        run: |
          lake env lean CheckTrackEActualCountableRH.lean > track-e-countable-rh-axioms.log
          cat track-e-countable-rh-axioms.log
          python3 scripts/check_axioms.py track-e-countable-rh-axioms.log CheckTrackEActualCountableRH.lean
          python3 scripts/check_no_placeholders.py
