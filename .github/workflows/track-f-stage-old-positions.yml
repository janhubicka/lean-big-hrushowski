name: Track F next SCC preserves positions of old lower part
on:
  push:
    paths:
      - 'BigHrushovski/N0StageOldPositionInvariance.lean'
      - 'CheckTrackFStageOldPositionsAxioms.lean'
      - 'scripts/check_track_f_stage_old_positions.py'
      - '.github/workflows/track-f-stage-old-positions.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0StageOldPositionInvariance.lean'
      - 'CheckTrackFStageOldPositionsAxioms.lean'
      - 'scripts/check_track_f_stage_old_positions.py'
      - '.github/workflows/track-f-stage-old-positions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-position-invariance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.PiLex
      - name: Build old-position invariance
        run: lake build BigHrushovski.N0StageOldPositionInvariance
      - name: Kernel axiom and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckTrackFStageOldPositionsAxioms.lean > track-f-stage-old-axioms.log
          python3 scripts/check_axioms.py track-f-stage-old-axioms.log CheckTrackFStageOldPositionsAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite tests
        run: |
          python3 scripts/check_track_f_stage_old_positions.py
          python3 scripts/check_track_f_initial_lower_positions.py
