name: Track F global lexicographic reconstruction
on:
  push:
    paths:
      - 'BigHrushovski/N0GlobalLexReconstruction.lean'
      - 'CheckTrackFGlobalLexReconstructionAxioms.lean'
      - 'scripts/check_track_f_global_lex_reconstruction.py'
      - '.github/workflows/track-f-global-lex-reconstruction.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0GlobalLexReconstruction.lean'
      - 'CheckTrackFGlobalLexReconstructionAxioms.lean'
      - 'scripts/check_track_f_global_lex_reconstruction.py'
      - '.github/workflows/track-f-global-lex-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lex-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.Prod.Lex.Basic
      - name: Build global comparison reconstruction
        run: lake build BigHrushovski.N0GlobalLexReconstruction
      - name: Kernel axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckTrackFGlobalLexReconstructionAxioms.lean > track-f-lex-reconstruction-axioms.log
          python3 scripts/check_axioms.py track-f-lex-reconstruction-axioms.log CheckTrackFGlobalLexReconstructionAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent labelled-order check
        run: python3 scripts/check_track_f_global_lex_reconstruction.py
