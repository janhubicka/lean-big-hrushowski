name: Track A enabled intrinsic-component existence

on:
  push:
    paths:
      - 'BigHrushovski/C0EnabledComponentExistence.lean'
      - 'CheckC0EnabledComponentExistence.lean'
      - 'scripts/check_c0_one_component_minimal.py'
      - '.github/workflows/track-a-enabled-component-existence.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0EnabledComponentExistence.lean'
      - 'CheckC0EnabledComponentExistence.lean'
      - 'scripts/check_c0_one_component_minimal.py'
      - '.github/workflows/track-a-enabled-component-existence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build enabled component existence theorem
        run: lake build BigHrushovski.C0EnabledComponentExistence
      - name: Exact theorem axioms and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0EnabledComponentExistence.lean > c0-enabled-existence-axioms.log
          python3 scripts/check_axioms.py c0-enabled-existence-axioms.log CheckC0EnabledComponentExistence.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite single-component check
        run: python3 scripts/check_c0_one_component_minimal.py
