name: Track A final finite-closed C0 functional homogeneity
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalClosedHomogeneity.lean'
      - 'BigHrushovski/C0FunctionalActualHomogeneity.lean'
      - 'BigHrushovski/C0FunctionalActualForth.lean'
      - 'BigHrushovski/C0FunctionalPartialBaseTransport.lean'
      - 'CheckC0FunctionalClosedHomogeneity.lean'
      - '.github/workflows/track-a-closed-functional-homogeneity.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalClosedHomogeneity.lean'
      - 'BigHrushovski/C0FunctionalActualHomogeneity.lean'
      - 'BigHrushovski/C0FunctionalActualForth.lean'
      - 'BigHrushovski/C0FunctionalPartialBaseTransport.lean'
      - 'CheckC0FunctionalClosedHomogeneity.lean'
      - '.github/workflows/track-a-closed-functional-homogeneity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build closed functional homogeneity
        run: lake build BigHrushovski.C0FunctionalClosedHomogeneity
      - name: Exact closed homogeneity axiom and all-source placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalClosedHomogeneity.lean > c0-closed-homogeneity-axioms.log
          python3 scripts/check_axioms.py c0-closed-homogeneity-axioms.log CheckC0FunctionalClosedHomogeneity.lean
          python3 scripts/check_no_placeholders.py
      - name: Finite closed-functional homogeneity falsification
        run: python3 scripts/check_c0_functional_actual_homogeneity.py
      - name: Finite actual closed-functional forth falsification
        run: python3 scripts/check_c0_functional_actual_forth.py
