name: Track F all fixed-lower minimum code fibres
on:
  push:
    paths:
      - 'BigHrushovski/N0AllFixedLowerMinimum.lean'
      - 'CheckTrackFAllFixedLowerAxioms.lean'
      - 'scripts/check_track_f_all_fixed_lower.py'
      - '.github/workflows/track-f-all-fixed-lower.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0AllFixedLowerMinimum.lean'
      - 'CheckTrackFAllFixedLowerAxioms.lean'
      - 'scripts/check_track_f_all_fixed_lower.py'
      - '.github/workflows/track-f-all-fixed-lower.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-fixed-lower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build genuine fixed-lower fibre theorem
        run: lake build BigHrushovski.N0AllFixedLowerMinimum
      - name: Verify kernel axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFAllFixedLowerAxioms.lean > track-f-all-fixed-lower-axioms.log
          python3 scripts/check_axioms.py track-f-all-fixed-lower-axioms.log CheckTrackFAllFixedLowerAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite adversarial regression
        run: python3 scripts/check_track_f_all_fixed_lower.py
