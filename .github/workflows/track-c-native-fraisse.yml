name: Track C actual strong Fraisse-limit presentation
on:
  pull_request:
    paths:
      - "BigHrushovski/CFStrongFraisseLimitPresentation.lean"
      - "TrackCStrongFraisseCheck.lean"
      - ".github/workflows/track-c-native-fraisse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strong-fraisse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build real strong Fraisse-limit recognition
        run: lake build BigHrushovski.CFStrongFraisseLimitPresentation
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCStrongFraisseCheck.lean > track-c-fraisse-limit-axioms.log
          python3 scripts/check_axioms.py track-c-fraisse-limit-axioms.log TrackCStrongFraisseCheck.lean
          python3 scripts/check_no_placeholders.py
