name: Track C actual birth strong Fraisse presentation
on:
  pull_request:
    paths:
      - "BigHrushovski/CFPublishedOwnFraissePresentation.lean"
      - "TrackCPublishedOwnFraisseCheck.lean"
      - ".github/workflows/track-c-own-standard-fraisse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-fraisse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build actual published strong Fraisse presentation
        run: lake build BigHrushovski.CFPublishedOwnFraissePresentation
      - name: Audit axioms and placeholders
        run: |
          lake env lean TrackCPublishedOwnFraisseCheck.lean > track-c-own-fraisse-axioms.log
          python3 scripts/check_axioms.py track-c-own-fraisse-axioms.log TrackCPublishedOwnFraisseCheck.lean
          python3 scripts/check_no_placeholders.py
