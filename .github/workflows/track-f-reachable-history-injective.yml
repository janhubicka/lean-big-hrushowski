name: Track F reachable tagged SCC history injectivity
on:
  push:
    paths:
      - 'BigHrushovski/N0ReachableHistoryInjective.lean'
      - 'CheckAxiomsN0ReachableHistoryInjective.lean'
      - 'scripts/check_track_f_reachable_history_injective.py'
      - '.github/workflows/track-f-reachable-history-injective.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0ReachableHistoryInjective.lean'
      - 'CheckAxiomsN0ReachableHistoryInjective.lean'
      - 'scripts/check_track_f_reachable_history_injective.py'
      - '.github/workflows/track-f-reachable-history-injective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic
      - name: Compile actual reachable history inverse
        run: lake build BigHrushovski.N0ReachableHistoryInjective
      - name: Exact named theorem axiom and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckAxiomsN0ReachableHistoryInjective.lean > reach-inverse-axioms.log
          python3 scripts/check_axioms.py reach-inverse-axioms.log CheckAxiomsN0ReachableHistoryInjective.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent history-to-assignment inverse tests
        run: |
          python3 scripts/check_track_f_reachable_history_injective.py
          python3 scripts/check_track_f_tagged_histories.py
