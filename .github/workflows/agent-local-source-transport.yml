name: Temporary Lean Big Hrushovski source export

on:
  pull_request:
    paths:
      - .github/workflows/agent-local-source-transport.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source and pinned successor dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          git rev-parse HEAD > transfer/SOURCE_SHA
          git archive --format=tar HEAD | gzip -1 > transfer/repo.tar.gz
          git clone --quiet https://github.com/janhubicka/lean-successors.git successors
          git -C successors checkout --quiet ce5ce187ef88e28d84a4a465517b3f9c87a0640a
          git -C successors rev-parse HEAD > transfer/SUCCESSORS_SHA
          git -C successors archive --format=tar HEAD | gzip -1 > transfer/successors.tar.gz
          cp lean-toolchain lake-manifest.json transfer/
          (cd transfer && shasum -a 256 repo.tar.gz successors.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hrushovski-source-20261109
          path: transfer/
          compression-level: 0
          retention-days: 1

  cache-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous full Lean CI workspace
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Pack only compiled Hrushovski and successors Lean artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo 'Cached project build root:'
          find .lake/build -maxdepth 4 -type d 2>/dev/null | head -35 || true
          echo 'Cached successor build root:'
          find .lake/packages/successor-tree-lean/.lake/build -maxdepth 4 -type d 2>/dev/null | head -35 || true
          echo 'Sample compiled source modules:'
          find .lake -name 'CFVerifiedCutInduction.olean' -o -name 'SuccessorTree.olean' | head -20
          test -d .lake/build/lib/lean
          test -d .lake/packages/successor-tree-lean/.lake/build/lib/lean
          mkdir -p transfer
          git rev-parse HEAD > transfer/SOURCE_SHA
          tar -I 'zstd -T0 -5' -cf transfer/compiled.tar.zst \
            .lake/build/lib/lean \
            .lake/packages/successor-tree-lean/.lake/build/lib/lean
          (cd transfer && sha256sum compiled.tar.zst > SHA256SUMS)
          du -sh transfer/compiled.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hrushovski-compiled-20261109
          path: transfer/
          compression-level: 0
          retention-days: 1
