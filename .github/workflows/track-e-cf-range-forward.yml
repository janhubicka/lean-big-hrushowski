name: Track E CF forward embedding-range audit

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFRangeForward.lean'
      - 'CheckTrackECFRangeForward.lean'
      - '.github/workflows/track-e-cf-range-forward.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFRangeForward.lean'
      - 'CheckTrackECFRangeForward.lean'
      - '.github/workflows/track-e-cf-range-forward.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-forward-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-forward-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile forward range proof and audit kernel dependencies
        run: |
          lake build BigHrushovski.HrushovskiEllentuckCFRangeForward
          lake env lean CheckTrackECFRangeForward.lean > cf-range-forward-axioms.log
          cat cf-range-forward-axioms.log
          python3 scripts/check_axioms.py cf-range-forward-axioms.log CheckTrackECFRangeForward.lean
          python3 scripts/check_no_placeholders.py
