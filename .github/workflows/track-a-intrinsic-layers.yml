name: Track A finite unary closure layers

on:
  push:
    paths:
      - 'BigHrushovski/C0CountableIntrinsicLayers.lean'
      - 'CheckC0IntrinsicLayers.lean'
      - 'scripts/check_c0_unary_finite_layers.py'
      - '.github/workflows/track-a-intrinsic-layers.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0CountableIntrinsicLayers.lean'
      - 'CheckC0IntrinsicLayers.lean'
      - 'scripts/check_c0_unary_finite_layers.py'
      - '.github/workflows/track-a-intrinsic-layers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite unary closure layers
        run: lake build BigHrushovski.C0CountableIntrinsicLayers
      - name: Audit exact theorem assumptions
        run: |
          set -euo pipefail
          lake env lean CheckC0IntrinsicLayers.lean > c0-intrinsic-layers-axioms.log
          python3 scripts/check_axioms.py c0-intrinsic-layers-axioms.log CheckC0IntrinsicLayers.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite unary layer and rank-cut regression
        run: python3 scripts/check_c0_unary_finite_layers.py
