name: Track F actual tagged history canonical steps
on:
  push:
    paths:
      - 'BigHrushovski/N0TaggedHistoryCanonicalStep.lean'
      - 'CheckAxiomsN0TaggedHistoryStep.lean'
      - 'scripts/check_track_f_tagged_canonical_step.py'
      - '.github/workflows/track-f-tagged-canonical-step.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0TaggedHistoryCanonicalStep.lean'
      - 'CheckAxiomsN0TaggedHistoryStep.lean'
      - 'scripts/check_track_f_tagged_canonical_step.py'
      - '.github/workflows/track-f-tagged-canonical-step.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.PiLex
      - name: Compile canonical tagged next-step lemmas
        run: lake build BigHrushovski.N0TaggedHistoryCanonicalStep
      - name: Exact-head axiom and placeholder scans
        run: |
          set -euo pipefail
          lake env lean CheckAxiomsN0TaggedHistoryStep.lean > tagged-step-axioms.log
          python3 scripts/check_axioms.py tagged-step-axioms.log CheckAxiomsN0TaggedHistoryStep.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent rank-prefix canonicality checks
        run: |
          python3 scripts/check_track_f_tagged_canonical_step.py
          python3 scripts/check_track_f_canonical_prefix_locality.py
