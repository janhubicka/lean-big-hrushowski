name: Track C published growth adapter
on:
  pull_request:
    paths:
      - "BigHrushovski/CFNonnegativeGrowthAdapter.lean"
      - "BigHrushovski/CFPublishedFiniteGenericity.lean"
      - "TrackCGrowthAdapterCheck.lean"
      - ".github/workflows/track-c-growth-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build published-domain adapter
        run: lake build BigHrushovski.CFPublishedFiniteGenericity
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCGrowthAdapterCheck.lean > track-c-growth-axioms.log
          python3 scripts/check_axioms.py track-c-growth-axioms.log TrackCGrowthAdapterCheck.lean
          python3 scripts/check_no_placeholders.py
