name: Track A arbitrary embedded-base two-sided functional amalgam
on:
  push:
    paths:
      - 'BigHrushovski/C0TwoSidedEmbeddedAmalgam.lean'
      - 'CheckC0TwoSidedEmbeddedAmalgam.lean'
      - 'scripts/check_c0_two_sided_embedded_amalgam.py'
      - '.github/workflows/track-a-two-sided-embedded-amalgam.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0TwoSidedEmbeddedAmalgam.lean'
      - 'CheckC0TwoSidedEmbeddedAmalgam.lean'
      - 'scripts/check_c0_two_sided_embedded_amalgam.py'
      - '.github/workflows/track-a-two-sided-embedded-amalgam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build actual arbitrary embedded-base functional amalgam
        run: lake build BigHrushovski.C0TwoSidedEmbeddedAmalgam
      - name: Exact theorem axioms and source placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0TwoSidedEmbeddedAmalgam.lean > c0-two-sided-embedded-axioms.log
          python3 scripts/check_axioms.py c0-two-sided-embedded-axioms.log CheckC0TwoSidedEmbeddedAmalgam.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent exhaustive finite full-function and graph regression
        run: python3 scripts/check_c0_two_sided_embedded_amalgam.py
