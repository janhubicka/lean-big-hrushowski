name: Track F full fixed-old C_B enumeration bijection
on:
  push:
    paths:
      - 'BigHrushovski/N0StageFixedOldClosureBijection.lean'
      - 'CheckTrackFStageFixedOldBijectionAxioms.lean'
      - 'scripts/check_track_f_stage_fixed_old_bijection.py'
      - 'BigHrushovski/N0StageTopOrderRestriction.lean'
      - 'BigHrushovski/N0StageOldPositionInvariance.lean'
      - '.github/workflows/track-f-stage-fixed-old-bijection.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0StageFixedOldClosureBijection.lean'
      - 'CheckTrackFStageFixedOldBijectionAxioms.lean'
      - 'scripts/check_track_f_stage_fixed_old_bijection.py'
      - 'BigHrushovski/N0StageTopOrderRestriction.lean'
      - 'BigHrushovski/N0StageOldPositionInvariance.lean'
      - '.github/workflows/track-f-stage-fixed-old-bijection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-fixed-old-bijection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.PiLex
      - name: Compile actual fixed-old closure bijection
        run: lake build BigHrushovski.N0StageFixedOldClosureBijection
      - name: Kernel axiom and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckTrackFStageFixedOldBijectionAxioms.lean > track-f-fixed-old-axioms.log
          python3 scripts/check_axioms.py track-f-fixed-old-axioms.log CheckTrackFStageFixedOldBijectionAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite equality and negative controls
        run: |
          python3 scripts/check_track_f_stage_fixed_old_bijection.py
          python3 scripts/check_track_f_stage_top_restriction.py
          python3 scripts/check_track_f_stage_old_positions.py
