name: Track E finite topology neighborhood bases

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteNeighborhoodBases.lean'
      - 'CheckTrackEFiniteNeighborhoodBases.lean'
      - 'scripts/check_cf_finite_neighborhood_bases.py'
      - 'docs/CF_FINITE_NEIGHBORHOOD_BASES_REFEREE_20261115.md'
      - '.github/workflows/track-e-finite-neighborhood-bases.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteNeighborhoodBases.lean'
      - 'CheckTrackEFiniteNeighborhoodBases.lean'
      - 'scripts/check_cf_finite_neighborhood_bases.py'
      - 'docs/CF_FINITE_NEIGHBORHOOD_BASES_REFEREE_20261115.md'
      - '.github/workflows/track-e-finite-neighborhood-bases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-neighborhood-bases-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-neighborhood-bases-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile finite topology neighborhood-basis identification
        run: lake build BigHrushovski.HrushovskiEllentuckFiniteNeighborhoodBases
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean CheckTrackEFiniteNeighborhoodBases.lean > track-e-neighborhood-axioms.log
          cat track-e-neighborhood-axioms.log
          python3 scripts/check_axioms.py track-e-neighborhood-axioms.log CheckTrackEFiniteNeighborhoodBases.lean
          python3 scripts/check_no_placeholders.py

      - name: Exhaust finite-level and enumeration-neighborhood regressions
        run: python3 scripts/check_cf_finite_neighborhood_bases.py
