name: Lean Coherent Finite Unary Stages

on:
  push:
    paths:
      - 'BigHrushovski/CoherentNatUnaryStages.lean'
      - 'CheckCoherentUnaryStages.lean'
      - '.github/workflows/coherent-unary-stages.yml'
  pull_request:
    paths:
      - 'BigHrushovski/CoherentNatUnaryStages.lean'
      - 'CheckCoherentUnaryStages.lean'
      - '.github/workflows/coherent-unary-stages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build coherent unary stages
        run: lake build BigHrushovski.CoherentNatUnaryStages
      - name: Check exact axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckCoherentUnaryStages.lean > coherent-unary-axioms.log
          python3 scripts/check_axioms.py coherent-unary-axioms.log CheckCoherentUnaryStages.lean
          python3 scripts/check_no_placeholders.py
