name: Track A fair birth canonical-value bridge

on:
  pull_request:
    paths:
      - 'BigHrushovski/C0FairBirthCanonicalValues.lean'
      - 'CheckC0FairBirthCanonicalValues.lean'
      - '.github/workflows/track-a-fair-birth-canonical-values.yml'
      - 'scripts/check_c0_fair_birth_index.py'
      - 'scripts/check_c0_lower_respecting_order.py'
  push:
    paths:
      - 'BigHrushovski/C0FairBirthCanonicalValues.lean'
      - 'CheckC0FairBirthCanonicalValues.lean'
      - '.github/workflows/track-a-fair-birth-canonical-values.yml'
      - 'scripts/check_c0_fair_birth_index.py'
      - 'scripts/check_c0_lower_respecting_order.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain','lakefile.toml','lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain','lakefile.toml','lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact fair-birth canonical-value bridge
        run: lake build BigHrushovski.C0FairBirthCanonicalValues
      - name: Verify exact theorem axioms and absence of placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FairBirthCanonicalValues.lean > c0-fair-birth-canonical-axioms.log
          python3 scripts/check_axioms.py c0-fair-birth-canonical-axioms.log CheckC0FairBirthCanonicalValues.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive fair birth index regression
        run: python3 scripts/check_c0_fair_birth_index.py
      - name: Exhaustive complete unary chronology regression
        run: python3 scripts/check_c0_lower_respecting_order.py
