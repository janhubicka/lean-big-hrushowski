name: Track A inverse closed functional base transport
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalPartialBaseTransport.lean'
      - 'CheckC0FunctionalPartialBaseTransport.lean'
      - 'scripts/check_c0_functional_partial_base_transport.py'
      - '.github/workflows/track-a-functional-partial-base-transport.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalPartialBaseTransport.lean'
      - 'CheckC0FunctionalPartialBaseTransport.lean'
      - 'scripts/check_c0_functional_partial_base_transport.py'
      - '.github/workflows/track-a-functional-partial-base-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build inverse full-functional base transport
        run: lake build BigHrushovski.C0FunctionalPartialBaseTransport
      - name: Exact axioms and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalPartialBaseTransport.lean > c0-partial-base-axioms.log
          python3 scripts/check_axioms.py c0-partial-base-axioms.log CheckC0FunctionalPartialBaseTransport.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive closed partial base inverse and relabelling test
        run: python3 scripts/check_c0_functional_partial_base_transport.py
