name: Lean C0 Functional Span Normalization

on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalSpanNormalization.lean'
      - 'BigHrushovski/C0FunctionalFiniteResponse.lean'
      - 'BigHrushovski/C0FunctionalFiniteInitialLabels.lean'
      - 'CheckC0FunctionalSpan.lean'
      - 'scripts/check_c0_functional_span_normalization.py'
      - '.github/workflows/track-a-span-normalization.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalSpanNormalization.lean'
      - 'BigHrushovski/C0FunctionalFiniteResponse.lean'
      - 'BigHrushovski/C0FunctionalFiniteInitialLabels.lean'
      - 'CheckC0FunctionalSpan.lean'
      - '.github/workflows/track-a-span-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact C0 finite arbitrary-span normalization
        run: lake build BigHrushovski.C0FunctionalFiniteInitialLabels
      - name: Audit exact theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalSpan.lean > c0-span-axioms.log
          python3 scripts/check_axioms.py c0-span-axioms.log CheckC0FunctionalSpan.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial complete unary value regression
        run: python3 scripts/check_c0_functional_span_normalization.py
