name: Track A general countable canonical C0 functional forth
on:
  push:
    paths:
      - 'BigHrushovski/C0GenericClosedFunctionalForth.lean'
      - 'CheckC0GenericClosedFunctionalForth.lean'
      - '.github/workflows/track-a-generic-functional-forth.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0GenericClosedFunctionalForth.lean'
      - 'CheckC0GenericClosedFunctionalForth.lean'
      - '.github/workflows/track-a-generic-functional-forth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build general C0 functional closed forth
        run: lake build BigHrushovski.C0GenericClosedFunctionalForth
      - name: Verify named theorem axioms and all-source placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0GenericClosedFunctionalForth.lean > c0-generic-forth-axioms.log
          python3 scripts/check_axioms.py c0-generic-forth-axioms.log CheckC0GenericClosedFunctionalForth.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite closed functional source/target regression
        run: python3 scripts/check_c0_functional_actual_forth.py
      - name: Independent inverse complete-base preservation regression
        run: python3 scripts/check_c0_functional_partial_base_transport.py
