name: Track E C0 A4 thinning tail transfer

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckThinningTail.lean'
      - 'CheckTrackEC0ThinningTail.lean'
      - '.github/workflows/track-e-c0-thinning-tail.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckThinningTail.lean'
      - 'CheckTrackEC0ThinningTail.lean'
      - '.github/workflows/track-e-c0-thinning-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-c0-thin-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-c0-thin-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile C0 A4 thinning tail transfer
        run: |
          lake build BigHrushovski.HrushovskiEllentuckThinningTail
          lake env lean CheckTrackEC0ThinningTail.lean > track-e-c0-thin-axioms.log
          cat track-e-c0-thin-axioms.log
          python3 scripts/check_axioms.py track-e-c0-thin-axioms.log CheckTrackEC0ThinningTail.lean
          python3 scripts/check_no_placeholders.py
