name: Track E CF inverse finite observations

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFInverseFiniteObservations.lean'
      - 'CheckTrackECFInverseFiniteObservations.lean'
      - '.github/workflows/track-e-cf-inverse-observations.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckCFInverseFiniteObservations.lean'
      - 'CheckTrackECFInverseFiniteObservations.lean'
      - '.github/workflows/track-e-cf-inverse-observations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-inverse-finite-observations-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-inverse-finite-observations-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile and audit inverse finite observation transfer
        run: |
          lake build BigHrushovski.HrushovskiEllentuckCFInverseFiniteObservations
          lake env lean CheckTrackECFInverseFiniteObservations.lean > track-e-inverse-obs-axioms.log
          cat track-e-inverse-obs-axioms.log
          python3 scripts/check_axioms.py track-e-inverse-obs-axioms.log CheckTrackECFInverseFiniteObservations.lean
          python3 scripts/check_no_placeholders.py
