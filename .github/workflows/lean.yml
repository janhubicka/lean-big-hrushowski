name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build all project modules
        run: |
          set -euo pipefail
          sources=(CheckAxioms.lean)
          mapfile -t targets < <(sed -n 's/^import //p' "${sources[@]}" | sort -u)
          if ! lake build BigHrushovski "${targets[@]}" > build.log 2>&1; then
            sed -n '/error:/,$p' build.log
            exit 1
          fi
          tail -1 build.log
      - name: Check theorem axioms
        run: |
          set -euo pipefail
          sources=(CheckAxioms.lean)
          : > axioms.log
          for source in "${sources[@]}"; do
            if ! lake env lean "$source" >> axioms.log 2>&1; then
              tail -100 axioms.log
              exit 1
            fi
          done
          python3 scripts/check_axioms.py axioms.log "${sources[@]}"
          python3 scripts/check_no_placeholders.py
      - name: Check all graphs on up to five vertices
        run: python3 scripts/check_finite_models.py
      - name: Check finite C0 embedded strong functional lift
        run: python3 scripts/check_c0_embedded_functional_lift.py
      - name: Check entire finite C0 strong graph-to-functional lift
        run: python3 scripts/check_c0_finite_functional_lift.py
      - name: Check one-block C0 index append preserves old values
        run: python3 scripts/check_c0_finite_append.py
      - name: Check persistence of old canonical C0 unary values
        run: python3 scripts/check_c0_prefix_persistence.py
      - name: Check full canonical C0 unary value restriction
        run: python3 scripts/check_c0_canonical_restriction.py
      - name: Check C0 full unary invariance under compatible component orders
        run: python3 scripts/check_c0_orientation_invariant_values.py
      - name: Check exchange of independent finite minimal C0 components
        run: python3 scripts/check_c0_independent_swap.py
      - name: Verify left-order-fixed C0 two-sided functional amalgams
        run: python3 scripts/check_c0_explicit_amalgam.py
      - name: Check intrinsic C0 component partition from unary values
        run: python3 scripts/check_c0_intrinsic_components.py
      - name: Check canonical finite C0 hereditary minimal presentations
        run: python3 scripts/check_c0_canonical_heredity.py
      - name: Check canonical finite C0 component-index values
        run: python3 scripts/check_c0_canonical_finite_values.py
      - name: Check complete C0 unary closure strongness
        run: python3 scripts/check_c0_unary_finite_strong.py
      - name: Check explicit finite C0 minimal strong block runs
        run: python3 scripts/check_c0_minimal_block_runs.py
      - name: Check absolute finite strong factorisation
        run: python3 scripts/check_c0_absolute_factorization.py
      - name: Check finite minimal decompositions
        run: python3 scripts/check_minimal_decomposition.py
      - name: Check six-vertex closure component
        run: python3 scripts/check_c0_triangle_component.py
      - name: Check old-neighbour and unordered back-edge correspondence
        run: python3 scripts/check_old_neighbours.py
      - name: Check strong chains in finite graphs
        run: python3 scripts/check_strong_chains.py
      - name: Check predimension modularity and strongness in free unions
        run: python3 scripts/check_free_amalgam.py
      - name: Check 2-sparsity under strong no-crossing unions
        run: python3 scripts/check_c0_free_union_sparsity.py

      - name: Check actual free joins of finite induced graphs
        run: python3 scripts/check_actual_free_join.py
      - name: Verify canonical tagged free graph amalgams
        run: python3 scripts/check_tagged_amalgams.py
      - name: Check induced embedding predimension and strongness
        run: python3 scripts/check_induced_embedding.py
      - name: Check arbitrary finite strong amalgamation spans
        run: python3 scripts/check_abstract_amalgam.py
      - name: Check hereditary and strong joint embedding properties
        run: python3 scripts/check_c0_strong_age.py
      - name: Check fresh natural-number stage labels
        run: python3 scripts/check_fresh_nat_labels.py
      - name: Check gap-free Nat initial-segment labels
        run: python3 scripts/check_initial_segment_labels.py

      - name: Check growing strong response and forbidden weak amalgam
        run: python3 scripts/check_growing_nat_response.py

      - name: Check strict strong-closure predimension and uniqueness
        run: python3 scripts/check_strict_closure.py
      - name: Check C0 back-neighbour no-cross criterion
        run: python3 scripts/check_c0_no_cross.py
      - name: Check C0 local minimality under no-cross joins
        run: python3 scripts/check_c0_local_minimal.py
      - name: Audit strong, minimal-strong and strict d-closed no-cross transfers
        run: python3 scripts/check_cf_strict_local.py
      - name: Audit finite d-closed decomposition and one-generated hulls
        run: python3 scripts/check_cf_dclosed_decomposition.py
      - name: Audit canonical finite CF local support from old neighbours
        run: python3 scripts/check_cf_local_support.py
      - name: Audit bounded ordered CF local-type catalogue
        run: python3 scripts/check_cf_ordered_catalogue.py
      - name: Audit increasing ordered CF block normalization
        run: python3 scripts/check_cf_ordered_normalization.py
      - name: Audit strict d-closed induced embedding transport
        run: python3 scripts/check_cf_dclosed_transport.py
      - name: Audit intrinsic CF old-neighbour support image transport
        run: python3 scripts/check_cf_old_support_image.py
      - name: Audit fully normalized ordered CF local type records
        run: python3 scripts/check_cf_normalized_local_type.py
      - name: Audit exact CF supports after free one-block attachments
        run: python3 scripts/check_cf_support_persistence.py
      - name: Audit finite level requests over actual CF supports
        run: python3 scripts/check_cf_stage_catalogue.py
      - name: Audit explicit tagged simultaneous CF stage graph
        run: python3 scripts/check_cf_tagged_simultaneous.py
      - name: Audit strict closure of chronological C_F two-block runs
        run: python3 scripts/check_cf_batch_closure_run.py
      - name: Check nonempty C0 trace offsets and boundary joins
        run: python3 scripts/check_c0_trace_offsets.py
      - name: Check finite C0 back-edge ancestor closure
        run: python3 scripts/check_c0_ancestor_closure.py
      - name: Check finite C0 generated unary closure algebra
        run: python3 scripts/check_c0_generated_closure.py
      - name: Check finite C0 reduct-lifting spans
        run: python3 scripts/check_c0_reduct_lifting.py
      - name: Check tagged minimal C0 free amalgams
        run: python3 scripts/check_c0_tagged_minimal.py
      - name: Check induced minimal strong extension images
        run: python3 scripts/check_c0_minimal_image.py
      - name: Check tagged free-amalgam dependency ancestry
        run: python3 scripts/check_c0_tagged_dependency.py
      - name: Check directed C0 component embedding closure transport
        run: python3 scripts/check_c0_embedding_equivalence.py
