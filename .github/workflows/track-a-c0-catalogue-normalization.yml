name: Track A finite functional request normalization

on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalCatalogueNormalization.lean'
      - 'CheckC0CatalogueNormalization.lean'
      - '.github/workflows/track-a-c0-catalogue-normalization.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalCatalogueNormalization.lean'
      - 'CheckC0CatalogueNormalization.lean'
      - '.github/workflows/track-a-c0-catalogue-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite functional catalogue normalization
        run: lake build BigHrushovski.C0FunctionalCatalogueNormalization
      - name: Exact axiom and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0CatalogueNormalization.lean > c0-catalogue-normalization-axioms.log
          python3 scripts/check_axioms.py c0-catalogue-normalization-axioms.log CheckC0CatalogueNormalization.lean
          python3 scripts/check_no_placeholders.py
