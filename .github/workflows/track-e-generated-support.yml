name: Track E generated finite support

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckGeneratedSupport.lean'
      - 'CheckTrackEGeneratedSupport.lean'
      - '.github/workflows/track-e-generated-support.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckGeneratedSupport.lean'
      - 'CheckTrackEGeneratedSupport.lean'
      - '.github/workflows/track-e-generated-support.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-generated-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-generated-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile generated support bridge
        run: lake build BigHrushovski.HrushovskiEllentuckGeneratedSupport
      - name: Audit exact axioms and placeholders
        run: |
          lake env lean CheckTrackEGeneratedSupport.lean > generated-support-axioms.log
          cat generated-support-axioms.log
          python3 scripts/check_axioms.py generated-support-axioms.log CheckTrackEGeneratedSupport.lean
          python3 scripts/check_no_placeholders.py
