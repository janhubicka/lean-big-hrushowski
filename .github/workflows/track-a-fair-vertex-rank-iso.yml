name: Track A explicit fair vertex rank order isomorphism
on:
  push:
    paths:
      - 'BigHrushovski/C0FairVertexRankIso.lean'
      - 'CheckC0FairVertexRankIso.lean'
      - 'scripts/check_c0_fair_vertex_rank_iso.py'
      - '.github/workflows/track-a-fair-vertex-rank-iso.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FairVertexRankIso.lean'
      - 'CheckC0FairVertexRankIso.lean'
      - 'scripts/check_c0_fair_vertex_rank_iso.py'
      - '.github/workflows/track-a-fair-vertex-rank-iso.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile exact fair vertex rank isomorphism
        run: lake build BigHrushovski.C0FairVertexRankIso
      - name: Audit the nine exact axioms and all placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FairVertexRankIso.lean > c0-rank-iso-axioms.log
          python3 scripts/check_axioms.py c0-rank-iso-axioms.log CheckC0FairVertexRankIso.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite rank-isomorphism test
        run: python3 scripts/check_c0_fair_vertex_rank_iso.py
      - name: Original general local-key order tests
        run: python3 scripts/check_c0_fair_vertex_order_omega.py
