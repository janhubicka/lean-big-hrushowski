name: Track F induced finite orientations
on:
  push:
    paths:
      - 'BigHrushovski/OrientationInducedFinite.lean'
      - 'CheckTrackFInducedAxioms.lean'
      - 'scripts/check_track_f_induced.py'
      - '.github/workflows/track-f-induced.yml'
  pull_request:
    paths:
      - 'BigHrushovski/OrientationInducedFinite.lean'
      - 'CheckTrackFInducedAxioms.lean'
      - 'scripts/check_track_f_induced.py'
      - '.github/workflows/track-f-induced.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  induced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite induced orientation
        run: lake build BigHrushovski.OrientationInducedFinite
      - name: Audit axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFInducedAxioms.lean > track-f-induced-axioms.log
          python3 scripts/check_axioms.py track-f-induced-axioms.log CheckTrackFInducedAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent induced regression
        run: python3 scripts/check_track_f_induced.py
