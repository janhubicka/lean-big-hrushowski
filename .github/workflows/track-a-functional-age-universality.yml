name: Track A functional C0 age universality
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalAgeUniversality.lean'
      - 'CheckC0FunctionalAgeUniversality.lean'
      - '.github/workflows/track-a-functional-age-universality.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalAgeUniversality.lean'
      - 'CheckC0FunctionalAgeUniversality.lean'
      - '.github/workflows/track-a-functional-age-universality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build actual finite functional universality
        run: lake build BigHrushovski.C0FunctionalAgeUniversality
      - name: Verify exact theorem axioms and all-source placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalAgeUniversality.lean > c0-age-universal-axioms.log
          python3 scripts/check_axioms.py c0-age-universal-axioms.log CheckC0FunctionalAgeUniversality.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite named-base embedding regression
        run: python3 scripts/check_c0_named_base_response.py
