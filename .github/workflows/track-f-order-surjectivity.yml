name: Track F actual global order reconstruction surjectivity
on:
  push:
    paths:
      - 'BigHrushovski/N0GlobalOrderSurjectivity.lean'
      - 'CheckTrackFGlobalOrderSurjectivityAxioms.lean'
      - 'scripts/check_track_f_order_surjectivity.py'
      - '.github/workflows/track-f-order-surjectivity.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0GlobalOrderSurjectivity.lean'
      - 'CheckTrackFGlobalOrderSurjectivityAxioms.lean'
      - 'scripts/check_track_f_order_surjectivity.py'
      - '.github/workflows/track-f-order-surjectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surjectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.Prod.Lex.Basic
      - name: Build actual labelled-order reconstruction
        run: lake build BigHrushovski.N0GlobalOrderSurjectivity
      - name: Kernel axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckTrackFGlobalOrderSurjectivityAxioms.lean > track-f-order-surjectivity-axioms.log
          python3 scripts/check_axioms.py track-f-order-surjectivity-axioms.log CheckTrackFGlobalOrderSurjectivityAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent exhaustive labelled-order reconstruction
        run: python3 scripts/check_track_f_order_surjectivity.py
