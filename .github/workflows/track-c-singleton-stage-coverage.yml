name: Track C singleton request at every stage
on:
  pull_request:
    paths:
      - "BigHrushovski/CFSingletonStageCoverage.lean"
      - "TrackCSingletonStageCoverageCheck.lean"
      - ".github/workflows/track-c-singleton-stage-coverage.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  singleton-stages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build singleton stage coverage
        run: lake build BigHrushovski.CFSingletonStageCoverage
      - name: Audit exact axioms and proof placeholders
        run: |
          lake env lean TrackCSingletonStageCoverageCheck.lean > track-c-singleton-coverage-axioms.log
          python3 scripts/check_axioms.py track-c-singleton-coverage-axioms.log TrackCSingletonStageCoverageCheck.lean
          python3 scripts/check_no_placeholders.py
