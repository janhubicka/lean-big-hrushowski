name: Track C published birth genericity
on:
  pull_request:
    paths:
      - "BigHrushovski/CFPublishedBirthGenericity.lean"
      - "TrackCPublishedBirthCheck.lean"
      - ".github/workflows/track-c-published-birth-generic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build published birth genericity
        run: lake build BigHrushovski.CFPublishedBirthGenericity
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCPublishedBirthCheck.lean > track-c-published-birth-axioms.log
          python3 scripts/check_axioms.py track-c-published-birth-axioms.log TrackCPublishedBirthCheck.lean
          python3 scripts/check_no_placeholders.py
