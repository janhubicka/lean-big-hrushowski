name: Track F N0 finite component data
on:
  push:
    paths:
      - 'BigHrushovski/N0ComponentLowerPart.lean'
      - 'BigHrushovski/N0ComponentLinearExtensions.lean'
      - 'CheckTrackFComponentDataAxioms.lean'
      - 'scripts/check_track_f_n0_component_data.py'
      - 'scripts/check_track_f_n0_local_fibres.py'
      - 'scripts/check_track_f_n0_all_orders_five.py'
      - '.github/workflows/track-f-n0-data.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0ComponentLowerPart.lean'
      - 'BigHrushovski/N0ComponentLinearExtensions.lean'
      - 'CheckTrackFComponentDataAxioms.lean'
      - 'scripts/check_track_f_n0_component_data.py'
      - '.github/workflows/track-f-n0-data.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  finite-component-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite component data
        run: lake build BigHrushovski.N0ComponentLinearExtensions
      - name: Audit theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFComponentDataAxioms.lean > component-data-axioms.log
          python3 scripts/check_axioms.py component-data-axioms.log CheckTrackFComponentDataAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial finite regression
        run: |
          python3 scripts/check_track_f_n0_component_data.py
          python3 scripts/check_track_f_n0_local_fibres.py
          python3 scripts/check_track_f_n0_all_orders_five.py
