name: Track A uniqueness of full countable functional C0 limits
on:
  push:
    paths:
      - 'BigHrushovski/C0GenericFunctionalUniqueness.lean'
      - 'CheckC0GenericFunctionalUniqueness.lean'
      - '.github/workflows/track-a-generic-functional-uniqueness.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0GenericFunctionalUniqueness.lean'
      - 'CheckC0GenericFunctionalUniqueness.lean'
      - '.github/workflows/track-a-generic-functional-uniqueness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build general countable C0 functional uniqueness
        run: lake build BigHrushovski.C0GenericFunctionalUniqueness
      - name: Exact four theorem axioms and source placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0GenericFunctionalUniqueness.lean > c0-general-uniqueness-axioms.log
          python3 scripts/check_axioms.py c0-general-uniqueness-axioms.log CheckC0GenericFunctionalUniqueness.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial finite functional joint-step and relabelling checks
        run: python3 scripts/check_c0_functional_actual_homogeneity.py
      - name: Adversarial coherent finite back-and-forth tests
        run: python3 scripts/check_c0_functional_joint_step_recursion.py
