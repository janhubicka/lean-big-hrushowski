name: Track A exact finite closed functional C0 age
on:
  push:
    paths:
      - 'BigHrushovski/C0ExactClosedFunctionalAge.lean'
      - 'CheckC0ExactClosedFunctionalAge.lean'
      - '.github/workflows/track-a-exact-functional-closed-age.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0ExactClosedFunctionalAge.lean'
      - 'CheckC0ExactClosedFunctionalAge.lean'
      - '.github/workflows/track-a-exact-functional-closed-age.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build both directions of the exact finite closed functional age
        run: lake build BigHrushovski.C0ExactClosedFunctionalAge
      - name: Exact two theorem axiom certificates and source placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckC0ExactClosedFunctionalAge.lean > c0-exact-functional-age-axioms.log
          python3 scripts/check_axioms.py c0-exact-functional-age-axioms.log CheckC0ExactClosedFunctionalAge.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite closed heredity including unused component levels
        run: python3 scripts/check_c0_closed_empty_step_heredity.py
      - name: Exhaustive complete unary value tests under relabelled finite closed images
        run: python3 scripts/check_c0_literal_closed_age.py
      - name: Exhaustive finite full-functional closed-image test
        run: python3 scripts/check_c0_full_functional_closed_images.py
