name: Track E countable lifts from finite uniqueness

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteRestriction.lean'
      - 'BigHrushovski/HrushovskiEllentuckCountableLiftFromFiniteUniqueness.lean'
      - 'CheckTrackECountableLiftFromFiniteUniqueness.lean'
      - '.github/workflows/track-e-countable-lift-criterion.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteRestriction.lean'
      - 'BigHrushovski/HrushovskiEllentuckCountableLiftFromFiniteUniqueness.lean'
      - 'CheckTrackECountableLiftFromFiniteUniqueness.lean'
      - '.github/workflows/track-e-countable-lift-criterion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-countable-lift-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-countable-lift-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build finite restriction and countable lifting criteria
        run: |
          lake build BigHrushovski.HrushovskiEllentuckFiniteRestriction
          lake build BigHrushovski.HrushovskiEllentuckCountableLiftFromFiniteUniqueness
      - name: Audit exact theorem axioms and source placeholders
        run: |
          lake env lean CheckTrackECountableLiftFromFiniteUniqueness.lean > track-e-countable-lift-axioms.log
          cat track-e-countable-lift-axioms.log
          python3 scripts/check_axioms.py track-e-countable-lift-axioms.log CheckTrackECountableLiftFromFiniteUniqueness.lean
          python3 scripts/check_no_placeholders.py
