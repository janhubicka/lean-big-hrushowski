name: Track F canonical SCC rank-prefix locality
on:
  push:
    paths:
      - 'BigHrushovski/N0CanonicalPrefixLocality.lean'
      - 'CheckTrackFCanonicalPrefixLocalityAxioms.lean'
      - 'scripts/check_track_f_canonical_prefix_locality.py'
      - '.github/workflows/track-f-canonical-prefix-locality.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0CanonicalPrefixLocality.lean'
      - 'CheckTrackFCanonicalPrefixLocalityAxioms.lean'
      - 'scripts/check_track_f_canonical_prefix_locality.py'
      - '.github/workflows/track-f-canonical-prefix-locality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.PiLex
      - name: Compile canonical prefix-locality theorem
        run: lake build BigHrushovski.N0CanonicalPrefixLocality
      - name: Kernel named theorem axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckTrackFCanonicalPrefixLocalityAxioms.lean > track-f-prefix-axioms.log
          python3 scripts/check_axioms.py track-f-prefix-axioms.log CheckTrackFCanonicalPrefixLocalityAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite predecessor and prefix audit
        run: |
          python3 scripts/check_track_f_canonical_prefix_locality.py
          python3 scripts/check_track_f_closure_locality.py
