name: Track F inherited component closure enumerations
on:
  push:
    paths:
      - 'BigHrushovski/N0InducedClosureOrders.lean'
      - 'CheckTrackFInducedClosureAxioms.lean'
      - 'scripts/check_track_f_induced_closure.py'
      - '.github/workflows/track-f-induced-closure.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0InducedClosureOrders.lean'
      - 'CheckTrackFInducedClosureAxioms.lean'
      - 'scripts/check_track_f_induced_closure.py'
      - '.github/workflows/track-f-induced-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-closure-restriction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Order.PiLex
      - name: Compile actual closure enumeration restriction
        run: lake build BigHrushovski.N0InducedClosureOrders
      - name: Audit all exact theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFInducedClosureAxioms.lean > track-f-induced-closure-axioms.log
          python3 scripts/check_axioms.py track-f-induced-closure-axioms.log CheckTrackFInducedClosureAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite regression and negative controls
        run: |
          python3 scripts/check_track_f_induced_closure.py
          python3 scripts/check_track_f_global_canonical_count.py
