name: Track F finite lexicographic component orders
on:
  push:
    paths:
      - 'BigHrushovski/N0GlobalLexOrder.lean'
      - 'CheckTrackFGlobalLexAxioms.lean'
      - 'scripts/check_track_f_global_lex_order.py'
      - '.github/workflows/track-f-global-lex.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0GlobalLexOrder.lean'
      - 'CheckTrackFGlobalLexAxioms.lean'
      - 'scripts/check_track_f_global_lex_order.py'
      - '.github/workflows/track-f-global-lex.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  finite-global-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build lexicographic component order
        run: lake build BigHrushovski.N0GlobalLexOrder
      - name: Kernel axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFGlobalLexAxioms.lean > global-lex-axioms.log
          python3 scripts/check_axioms.py global-lex-axioms.log CheckTrackFGlobalLexAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent finite lexicographic order checks
        run: python3 scripts/check_track_f_global_lex_order.py
