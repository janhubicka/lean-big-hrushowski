name: Track A functional back-and-forth complete unary limit
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalBackAndForthLimit.lean'
      - 'CheckC0FunctionalBackAndForthLimit.lean'
      - 'scripts/check_c0_functional_back_and_forth_limit.py'
      - '.github/workflows/track-a-functional-back-and-forth-limit.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalBackAndForthLimit.lean'
      - 'CheckC0FunctionalBackAndForthLimit.lean'
      - 'scripts/check_c0_functional_back_and_forth_limit.py'
      - '.github/workflows/track-a-functional-back-and-forth-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build complete-unary back-and-forth limit
        run: lake build BigHrushovski.C0FunctionalBackAndForthLimit
      - name: Exact theorem axiom and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalBackAndForthLimit.lean > c0-functional-limit-axioms.log
          python3 scripts/check_axioms.py c0-functional-limit-axioms.log CheckC0FunctionalBackAndForthLimit.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive finite nested closed partial-isomorphism regressions
        run: python3 scripts/check_c0_functional_back_and_forth_limit.py
