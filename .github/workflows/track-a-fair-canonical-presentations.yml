name: Track A fair prefixes are canonical finite stages
on:
  push:
    paths:
      - 'BigHrushovski/C0FairCanonicalPresentations.lean'
      - 'CheckC0FairCanonicalPresentations.lean'
      - 'scripts/check_c0_fair_canonical_presentations.py'
      - '.github/workflows/track-a-fair-canonical-presentations.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FairCanonicalPresentations.lean'
      - 'CheckC0FairCanonicalPresentations.lean'
      - 'scripts/check_c0_fair_canonical_presentations.py'
      - '.github/workflows/track-a-fair-canonical-presentations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build all fair canonical presentation theorems
        run: lake build BigHrushovski.C0FairCanonicalPresentations
      - name: Exact named theorem axioms and placeholder audit
        run: |
          set -euo pipefail
          lake env lean CheckC0FairCanonicalPresentations.lean > c0-fair-presentations-axioms.log
          python3 scripts/check_axioms.py c0-fair-presentations-axioms.log CheckC0FairCanonicalPresentations.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive independent finite canonical fair-stage regression
        run: python3 scripts/check_c0_fair_canonical_presentations.py
      - name: Exhaustive complete-value chronology regression
        run: python3 scripts/check_c0_fair_canonical_composed.py
