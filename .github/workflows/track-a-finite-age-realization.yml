name: Track A finite functional C0 age realization as closed strong images
on:
  push:
    paths:
      - 'BigHrushovski/C0FiniteAgeClosedRealization.lean'
      - 'CheckC0FiniteAgeClosedRealization.lean'
      - '.github/workflows/track-a-finite-age-realization.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FiniteAgeClosedRealization.lean'
      - 'CheckC0FiniteAgeClosedRealization.lean'
      - '.github/workflows/track-a-finite-age-realization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact finite functional C0 closed-age realization
        run: lake build BigHrushovski.C0FiniteAgeClosedRealization
      - name: Exact theorem axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckC0FiniteAgeClosedRealization.lean > c0-age-image-axioms.log
          python3 scripts/check_axioms.py c0-age-image-axioms.log CheckC0FiniteAgeClosedRealization.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive independent finite full-functional image closure
        run: python3 scripts/check_c0_full_functional_closed_images.py
      - name: Exhaustive independent finite stage response and value transport
        run: python3 scripts/check_c0_named_base_response.py
