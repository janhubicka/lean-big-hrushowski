name: Track F canonical local lex fibres
on:
  push:
    paths:
      - 'BigHrushovski/N0CanonicalLocalFibres.lean'
      - 'CheckTrackFCanonicalLocalAxioms.lean'
      - 'scripts/check_track_f_canonical_local.py'
      - '.github/workflows/track-f-canonical-local.yml'
  pull_request:
    paths:
      - 'BigHrushovski/N0CanonicalLocalFibres.lean'
      - 'CheckTrackFCanonicalLocalAxioms.lean'
      - 'scripts/check_track_f_canonical_local.py'
      - '.github/workflows/track-f-canonical-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Order.PiLex Mathlib.Tactic Mathlib.Data.Bool.Basic
      - name: Build actual canonical local class
        run: lake build BigHrushovski.N0CanonicalLocalFibres
      - name: Audit theorem axioms and placeholders
        run: |
          set -euo pipefail
          lake env lean CheckTrackFCanonicalLocalAxioms.lean > track-f-canonical-local-axioms.log
          python3 scripts/check_axioms.py track-f-canonical-local-axioms.log CheckTrackFCanonicalLocalAxioms.lean
          python3 scripts/check_no_placeholders.py
      - name: Independent induced-closure finite audit
        run: python3 scripts/check_track_f_canonical_local.py
