name: Track A actual closed-stage canonical-value transfer

on:
  push:
    paths:
      - 'BigHrushovski/C0FairCanonicalStageTransfer.lean'
      - 'CheckC0FairCanonicalStageTransfer.lean'
      - 'scripts/check_c0_closed_stage_transfer.py'
      - '.github/workflows/track-a-fair-closed-stage-values.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FairCanonicalStageTransfer.lean'
      - 'CheckC0FairCanonicalStageTransfer.lean'
      - 'scripts/check_c0_closed_stage_transfer.py'
      - '.github/workflows/track-a-fair-closed-stage-values.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain','lakefile.toml','lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain','lakefile.toml','lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build exact literal closed-stage transfer
        run: lake build BigHrushovski.C0FairCanonicalStageTransfer
      - name: Check exact axioms and source placeholders
        run: |
          set -euo pipefail
          lake env lean CheckC0FairCanonicalStageTransfer.lean > c0-fair-closed-values.log
          python3 scripts/check_axioms.py c0-fair-closed-values.log CheckC0FairCanonicalStageTransfer.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustively test closed restriction of canonical values
        run: python3 scripts/check_c0_closed_stage_transfer.py
      - name: Exhaustively test fair birth indices
        run: python3 scripts/check_c0_fair_birth_index.py
