name: Track E finite-character support completion

on:
  push:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteSupportCompletion.lean'
      - 'CheckTrackEFiniteSupportCompletion.lean'
      - '.github/workflows/track-e-finite-support-completion.yml'
  pull_request:
    paths:
      - 'BigHrushovski/HrushovskiEllentuckFiniteSupportCompletion.lean'
      - 'CheckTrackEFiniteSupportCompletion.lean'
      - '.github/workflows/track-e-finite-support-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-e-finite-completion-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-e-finite-completion-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Get Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Compile exact finite-character completion
        run: lake build BigHrushovski.HrushovskiEllentuckFiniteSupportCompletion
      - name: Standard-axiom and placeholder audit
        run: |
          lake env lean CheckTrackEFiniteSupportCompletion.lean > track-e-finite-completion-axioms.log
          cat track-e-finite-completion-axioms.log
          python3 scripts/check_axioms.py track-e-finite-completion-axioms.log CheckTrackEFiniteSupportCompletion.lean
          python3 scripts/check_no_placeholders.py
