name: Lean C0 Coherent Graph Unary Limit

on:
  push:
    paths:
      - 'BigHrushovski/CoherentNatC0Stages.lean'
      - 'CheckCoherentC0Stages.lean'
      - '.github/workflows/coherent-c0-stages.yml'
  pull_request:
    paths:
      - 'BigHrushovski/CoherentNatC0Stages.lean'
      - 'CheckCoherentC0Stages.lean'
      - '.github/workflows/coherent-c0-stages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build C0 coherent canonical limit bridge
        run: lake build BigHrushovski.CoherentNatC0Stages
      - name: Exact axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckCoherentC0Stages.lean > c0-coherent-axioms.log
          python3 scripts/check_axioms.py c0-coherent-axioms.log CheckCoherentC0Stages.lean
          python3 scripts/check_no_placeholders.py
