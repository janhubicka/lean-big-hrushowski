name: Track A unconditional extension over all finite closed C0 bases
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalAllClosedBaseExtension.lean'
      - 'CheckC0FunctionalAllClosedBaseExtension.lean'
      - 'BigHrushovski/C0NamedClosedBaseValues.lean'
      - 'BigHrushovski/C0FunctionalNamedBaseResponse.lean'
      - 'BigHrushovski/C0TwoSidedEmbeddedAmalgam.lean'
      - 'scripts/check_c0_two_sided_embedded_amalgam.py'
      - 'scripts/check_c0_named_base_response.py'
      - 'scripts/check_c0_named_closed_base_values.py'
      - '.github/workflows/track-a-all-closed-base-extension.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalAllClosedBaseExtension.lean'
      - 'CheckC0FunctionalAllClosedBaseExtension.lean'
      - 'BigHrushovski/C0NamedClosedBaseValues.lean'
      - 'BigHrushovski/C0FunctionalNamedBaseResponse.lean'
      - 'BigHrushovski/C0TwoSidedEmbeddedAmalgam.lean'
      - 'scripts/check_c0_two_sided_embedded_amalgam.py'
      - 'scripts/check_c0_named_base_response.py'
      - 'scripts/check_c0_named_closed_base_values.py'
      - '.github/workflows/track-a-all-closed-base-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build full arbitrary closed-base extension
        run: lake build BigHrushovski.C0FunctionalAllClosedBaseExtension
      - name: Exact theorem axiom check and full source placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalAllClosedBaseExtension.lean > c0-all-closed-base-axioms.log
          python3 scripts/check_axioms.py c0-all-closed-base-axioms.log CheckC0FunctionalAllClosedBaseExtension.lean
          python3 scripts/check_no_placeholders.py
      - name: Adversarial complete two-sided finite amalgamation test
        run: python3 scripts/check_c0_two_sided_embedded_amalgam.py
      - name: Adversarial named-base countable response composition test
        run: python3 scripts/check_c0_named_base_response.py
      - name: Adversarial original named complete base values test
        run: python3 scripts/check_c0_named_closed_base_values.py
