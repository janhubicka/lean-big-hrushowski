name: Track A countable response over finite named closed bases
on:
  push:
    paths:
      - 'BigHrushovski/C0FunctionalNamedBaseResponse.lean'
      - 'CheckC0FunctionalNamedBaseResponse.lean'
      - 'scripts/check_c0_named_base_response.py'
      - '.github/workflows/track-a-named-base-response.yml'
  pull_request:
    paths:
      - 'BigHrushovski/C0FunctionalNamedBaseResponse.lean'
      - 'CheckC0FunctionalNamedBaseResponse.lean'
      - 'scripts/check_c0_named_base_response.py'
      - '.github/workflows/track-a-named-base-response.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build actual named closed-base countable response theorem
        run: lake build BigHrushovski.C0FunctionalNamedBaseResponse
      - name: Exact theorem axioms and placeholder scan
        run: |
          set -euo pipefail
          lake env lean CheckC0FunctionalNamedBaseResponse.lean > c0-named-response-axioms.log
          python3 scripts/check_axioms.py c0-named-response-axioms.log CheckC0FunctionalNamedBaseResponse.lean
          python3 scripts/check_no_placeholders.py
      - name: Exhaustive independent named-base response diagram regression
        run: python3 scripts/check_c0_named_base_response.py
