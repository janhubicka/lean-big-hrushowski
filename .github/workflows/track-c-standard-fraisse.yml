name: Track C standard finite strong Fraisse extension
on:
  pull_request:
    paths:
      - "BigHrushovski/CFStandardFraisseExtension.lean"
      - "TrackCStandardFraisseCheck.lean"
      - ".github/workflows/track-c-standard-fraisse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard-fraisse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Basic
      - name: Build standard arbitrary-finite Fraisse property and transport
        run: lake build BigHrushovski.CFStandardFraisseExtension
      - name: Audit exact theorem axioms and placeholders
        run: |
          lake env lean TrackCStandardFraisseCheck.lean > track-c-standard-fraisse-axioms.log
          python3 scripts/check_axioms.py track-c-standard-fraisse-axioms.log TrackCStandardFraisseCheck.lean
          python3 scripts/check_no_placeholders.py
